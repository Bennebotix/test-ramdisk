name: Build SSH Ramdisk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Make tools executable
        run: chmod +x img4 pzb gtar trustcache

      - name: Download and decrypt ramdisk
        run: |
          set -ex
          IPSW_URL="https://updates.cdn-apple.com/2026WinterFCS/fullrestores/122-34179/047B0DE1-4C17-4CBB-ACA7-1EBBF92EE193/iPhone11,8_18.7.9_22H355_Restore.ipsw"

          ./pzb -g BuildManifest.plist "$IPSW_URL"

          RAMDISK_PATH=$(grep -A50 "RestoreRamDisk" BuildManifest.plist | grep -A1 "Path" | tail -1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          ./pzb -g "$RAMDISK_PATH" "$IPSW_URL"

          RAMDISK_FILE=$(ls *.dmg | head -1)
          ./img4 -i "$RAMDISK_FILE" -o ramdisk.dmg

      - name: Inject SSH and mount_filesystems into ramdisk
        run: |
          set -ex

          # RESIZE FIRST!
          sudo hdiutil resize -size 210m ramdisk.dmg

          mkdir -p SSHRD
          sudo hdiutil attach -mountpoint SSHRD -owners off ramdisk.dmg

          ./gtar -x --no-overwrite-dir -f ssh.tar.gz -C SSHRD

          cp mount_filesystems.safe SSHRD/usr/bin/mount_filesystems
          chmod 755 SSHRD/usr/bin/mount_filesystems

          sudo hdiutil detach -force SSHRD

          # Resize down after extraction
          sudo hdiutil resize -sectors min ramdisk.dmg

      - name: Build trustcache
        run: |
          set -ex
          ./img4 -i 094-32271-023.dmg.trustcache -o trustcache.bin

          mkdir -p work/sshtar
          ./gtar -x --no-overwrite-dir -f ssh.tar.gz -C work/sshtar

          cp mount_filesystems.safe work/sshtar/usr/bin/mount_filesystems

          ./trustcache append trustcache.bin $(cat sshtarlist.txt)

          ./img4 -i trustcache.bin -o trustcache.img4 -A -T rtsc -M IM4M_0x8020

      - name: Sign ramdisk
        run: |
          ./img4 -i ramdisk.dmg -o ramdisk.img4 -A -T rdsk -M IM4M_0x8020

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ramdisk-files
          path: |
            ramdisk.img4
            trustcache.img4